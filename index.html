<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Pro JSON Editor</title>
    
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 -960 960 960' fill='%232563EB'%3E%3Cpath d='M320-240 80-480l240-240 67 66-174 174 174 174-67 66Zm320 0-67-66 174-174-174-174 67-66 240 240-240 240Z'/%3E%3C/svg%3E">
    
    <link rel="stylesheet" href="dist/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <style>
        /* Custom Input Popup Styles */
        #input-popup-overlay, #message-popup-overlay, #confirm-popup-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); z-index: 3000;
            display: none; /* Toggled by JS */
            justify-content: center; align-items: center;
            backdrop-filter: blur(2px);
        }
        .custom-popup {
            background: var(--popup-bg-color, white);
            color: var(--popup-text-color, #333);
            padding: 20px; border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 320px;
            animation: popupFadeIn 0.2s ease-out;
        }
        .popup-input {
            width: 100%; padding: 8px 10px; margin: 10px 0 20px;
            box-sizing: border-box;
            border: 1px solid var(--input-border-color, #ddd);
            background: var(--input-bg-color, white);
            color: var(--input-text-color, black);
            border-radius: 4px; font-size: 14px;
        }
        .popup-input:focus { outline: 2px solid var(--primary-color, #2196F3); border-color: transparent; }
        .popup-buttons { display: flex; justify-content: flex-end; gap: 8px; }
        @keyframes popupFadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="toolbar">
    <span id="filename-display" class="filename-value" onkeydown="handleFilenameKey(event)" onblur="updateFilename(this)" ondblclick="this.contentEditable='true'; selectText(this);">data.json</span>

    <div id="status-bar" style="width: 1px; height: 24px; background: var(--border-color); margin: 0 10px;"></div>
    <input type="file" id="json-file" style="display:none" accept=".json" onchange="importJSON(event)">
    <div class="dropdown">
        <button class="dropdown-btn">파일</button>
        <div class="dropdown-content">
            <a onclick="document.getElementById('json-file').click();"><span class="material-symbols-outlined" style="vertical-align: middle; font-size: 18px; margin-right: 5px;">file_open</span> JSON 불러오기</a>
            <hr style="margin: 5px 0; border: 0; border-top: 1px solid var(--border-color);">
            <a onclick="downloadCurrentSheetData();"><span class="material-symbols-outlined" style="vertical-align: middle; font-size: 18px; margin-right: 5px;">description</span> 현재 시트 JSON 다운로드</a>
            <a onclick="downloadAllSheetsData();"><span class="material-symbols-outlined" style="vertical-align: middle; font-size: 18px; margin-right: 5px;">library_books</span> 전체 시트 JSON 다운로드</a>
            <a onclick="saveProject();"><span class="material-symbols-outlined" style="vertical-align: middle; font-size: 18px; margin-right: 5px;">save</span> 프로젝트 JSON파일 다운로드</a>
        </div>
    </div>
    <div class="dropdown">
        <button class="dropdown-btn">편집</button>
        <div class="dropdown-content">
            <a onclick="addColPrompt();"><span class="material-symbols-outlined" style="vertical-align: middle; font-size: 18px; margin-right: 5px;">add</span> 열 추가</a>
            <a onclick="addRowPrompt();"><span class="material-symbols-outlined" style="vertical-align: middle; font-size: 18px; margin-right: 5px;">add</span> 행 추가</a>
        </div>
    </div>
    <div class="dropdown">
        <button class="dropdown-btn">보기</button>
        <div class="dropdown-content">
            <a onclick="openJsonPopup('current');"><span class="material-symbols-outlined" style="vertical-align: middle; font-size: 18px; margin-right: 5px;">description</span> 현재 시트 JSON</a>
            <a onclick="openJsonPopup('full');"><span class="material-symbols-outlined" style="vertical-align: middle; font-size: 18px; margin-right: 5px;">library_books</span> 전체 데이터 JSON</a>
        </div>
    </div>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 5px;">
        <button onclick="zoomSheet('out')" title="축소" style="padding: 2px 8px;"><span class="material-symbols-outlined" style="font-size: 16px; vertical-align: middle;">remove</span></button>
        <span id="sheet-zoom-level" style="width: 40px; text-align: center; font-size: 13px; cursor: pointer;" onclick="zoomSheet('reset')" title="배율 초기화">100%</span>
        <button onclick="zoomSheet('in')" title="확대" style="padding: 2px 8px;"><span class="material-symbols-outlined" style="font-size: 16px; vertical-align: middle;">add</span></button>
    </div>
    
</div>

<div id="tabs" class="tabs"></div>
<div class="sheet-container">
    <table id="main-table">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
    </table>
</div>

<div id="column-context-menu" class="context-menu">
    <div class="context-menu-item" onclick="copyColumn()">복사</div>
    <div class="context-menu-item paste-item" onclick="pasteColumn()">붙여넣기</div>
    <div class="context-menu-item" onclick="deleteColumn()">삭제</div>
</div>

<div id="row-context-menu" class="context-menu">
    <div class="context-menu-item" onclick="copyRow()">행 복사 (Ctrl+C)</div>
    <div class="context-menu-item paste-item" onclick="pasteRow()">행 붙여넣기(Ctrl+V)</div>
    <div class="context-menu-item" onclick="deleteRow()">행 삭제 (Delete)</div>
</div>

<div id="json-popup-overlay" onclick="toggleJsonPopup(false)">
    <div class="json-preview-popup" onclick="event.stopPropagation()">
        <div class="popup-controls" style="position: absolute; top: 15px; right: 50px; display: flex; gap: 5px; align-items: center; z-index: 2;">
            <button onclick="zoomJsonPopup('out')" title="글씨 작게" style="padding: 2px 8px;"><span class="material-symbols-outlined" style="font-size: 16px; vertical-align: middle;">remove</span></button>
            <span id="json-zoom-level" style="font-size: 13px; width: 40px; text-align: center; color: var(--text-secondary-color); cursor: pointer;" onclick="zoomJsonPopup('reset')" title="배율 초기화">125%</span>
            <button onclick="zoomJsonPopup('in')" title="글씨 크게" style="padding: 2px 8px;"><span class="material-symbols-outlined" style="font-size: 16px; vertical-align: middle;">add</span></button>
        </div>
        <button class="popup-close-btn" onclick="toggleJsonPopup(false)"><span class="material-symbols-outlined" style="font-size: 20px; vertical-align: middle;">close</span></button>
        <div class="popup-tabs">
            <button class="popup-tab active" onclick="switchJsonPopupTab('current')">현재 시트 JSON</button>
            <button class="popup-tab" onclick="switchJsonPopupTab('full')">전체 데이터 JSON</button>
        </div>
        <div class="popup-content-container">
            <pre id="current-json" class="popup-content active"></pre>
            <pre id="full-json" class="popup-content"></pre>
            <pre id="rules-json" class="popup-content" contenteditable="true" spellcheck="false" onkeydown="handleRulesEditorKeyDown(event)"></pre>
        </div>
    </div>
</div>


<script src="dist/bundle.js"></script>
</html>
